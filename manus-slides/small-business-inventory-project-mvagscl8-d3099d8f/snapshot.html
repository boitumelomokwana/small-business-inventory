<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; color: #334155; }
    .slide-container { 
      width: 1280px; 
      min-height: 720px; 
      background: #F8F6F2; 
      display: flex; 
      flex-direction: column;
      padding: 48px;
      position: relative;
    }
    
    .motif-line {
      position: absolute;
      top: 80px;
      left: 48px;
      right: 48px;
      height: 1px;
      background: #0F172A;
    }
    
    .tracker-label {
      position: absolute;
      top: 54px;
      right: 48px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .content-area {
      flex: 1;
      padding-top: 80px; /* Space below motif line */
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    
    .title-block {
      max-width: 800px;
      margin-bottom: 80px;
    }
    
    h1 {
      font-family: 'Manrope', sans-serif;
      font-size: 56px;
      font-weight: 800;
      color: #0F172A;
      line-height: 1.1;
      margin-bottom: 24px;
    }
    
    .metadata-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      border-top: 1px solid #CBD5E1;
      padding-top: 32px;
      width: 100%;
    }
    
    .meta-item label {
      display: block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      text-transform: uppercase;
      margin-bottom: 12px;
      color: #334155;
    }
    
    .meta-item .value {
      font-family: 'Manrope', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #0F172A;
    }
    
    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #D97706; /* status-prog */
    }
    
    .dot {
      width: 12px;
      height: 12px;
      background: currentColor;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="tracker-label">SYS_INV // STATUS // 2026-10-15</div>
    <div class="motif-line"></div>
    
    <div class="content-area">
      <div class="title-block">
        <h1>Project Tracker:<br>Inventory & Sales System</h1>
        <p style="font-size: 20px; line-height: 1.5; max-width: 600px;">
          Deployment in progress. Core builds are successful; production database initialization and final validation remain unresolved.
        </p>
      </div>
      
      <div class="metadata-grid">
        <div class="meta-item">
          <label>Overall Status</label>
          <div class="value status-tag">
            <span class="dot"></span>
            IN PROGRESS
          </div>
        </div>
        <div class="meta-item">
          <label>Last Log Received</label>
          <div class="value">2026-10-15</div>
        </div>
        <div class="meta-item">
          <label>Critical Blocker</label>
          <div class="value" style="color: #E16D5E;">DATABASE_URL / SCHEMA</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
